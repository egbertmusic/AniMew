query GetMediaDetails($id: Int) {
  Media(id: $id) {
    id
    title {
      userPreferred
      romaji
      english
      native
    }
    type
    format
    status
    episodes
    description(asHtml: false)
    genres
    bannerImage
    coverImage {
      extraLarge
    }
    trailer {
      id
      site
      thumbnail
    }
    externalLinks {
      id
      url
      site
    }
    mediaListEntry {
      id
      status
      progress
    }
    relations {
      edges {
        relationType(version: 2)
        node {
          id
          title {
            userPreferred
          }
          type
          format
          status
          coverImage {
            large
          }
        }
      }
    }
  }
}

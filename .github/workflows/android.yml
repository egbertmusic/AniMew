name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create local.properties
      run: |
        echo "ANILIST_CLIENT_ID=${{ secrets.ANILIST_CLIENT_ID }}" >> local.properties
        echo "ANILIST_CLIENT_SECRET=${{ secrets.ANILIST_CLIENT_SECRET }}" >> local.properties
        # Add basic SDK dir for the runner environment
        echo "sdk.dir=/usr/local/lib/android/sdk" >> local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Rename APK for Release
      if: startsWith(github.ref, 'refs/tags/v')
      run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AniMew-${{ github.ref_name }}.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: AniMew ${{ github.ref_name }}
        files: app/build/outputs/apk/debug/AniMew-${{ github.ref_name }}.apk
        body: |
          ## Welcome to AniMew! 🐾
          The first official release of your personalized AniList tracker.
          
          ### What's New
          - ✨ **Modern UI**: Material 3 with Amoled and "Liquid Glass" themes.
          - 📚 **Library Sync**: Keep track of your anime and manga via AniList.
          - 🍿 **Media Servers**: Integrated support for Seerr, Plex, and Jellyfin.
          - 📱 **Home Screen Widgets**: Stay updated with airing schedules and stats.
          
          ### Installation
          Download the **AniMew-${{ github.ref_name }}.apk** attached below.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

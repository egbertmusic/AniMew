name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create local.properties
      run: |
        echo "ANILIST_CLIENT_ID=${{ secrets.ANILIST_CLIENT_ID }}" >> local.properties
        echo "ANILIST_CLIENT_SECRET=${{ secrets.ANILIST_CLIENT_SECRET }}" >> local.properties
        # Add basic SDK dir for the runner environment
        echo "sdk.dir=/usr/local/lib/android/sdk" >> local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Rename APK for Release
      if: startsWith(github.ref, 'refs/tags/v')
      run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AniMew-${{ github.ref_name }}.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: AniMew ${{ github.ref_name }}
        files: app/build/outputs/apk/debug/AniMew-${{ github.ref_name }}.apk
        body: |
          ## AniMew ${{ github.ref_name }} 🐾
          
          This major update introduces several highly requested features and a fresh coat of polish across the entire application.
          
          ### 🚀 Major New Features
          - 🎬 **Shorts Discovery Feed**: Explore anime and manga through a brand-new vertical scrolling video feed.
          - 🎭 **Dynamic App Icons**: Customize your home screen with multiple new app icon options.
          - 🔊 **Tactile UI Sounds**: Experience a more responsive interface with integrated sound effects.
          - 🎥 **TMDB Integration**: Enhanced metadata powered by The Movie Database for richer media details.
          
          ### ✨ Enhancements & Refinements
          - **Major UI Polish**: Wide-ranging visual improvements to Library, Search, and Detail screens.
          - **Advanced Seerr Logic**: Improved matching and status tracking for your media servers.
          - **Search Filtering**: Refined search experience with better tag visibility and grouping.
          
          ### 🐛 Bug Fixes
          - Resolved issues with OAuth redirect schemes.
          - Fixed settings persistence and UI synchronization bugs.
          - Improved stability of background widget updates.
          
          ### 📲 Installation
          Download the **AniMew-${{ github.ref_name }}.apk** attached below and install it on your Android device.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
